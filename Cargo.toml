[workspace]
resolver = "2"
members = [
    "crates/silman-core",
    "crates/silman-profile",
    "crates/silman-verbalize",
    "crates/si4-read",
    "app/silman-db",
    "bench/movegen-bench",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
repository = "https://example.invalid/silman"
rust-version = "1.80"

[workspace.dependencies]
cozy-chess = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tempfile = "3"
criterion = "0.5"

[profile.bench]
lto = "thin"

[profile.release]
lto = "thin"
