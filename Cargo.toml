[workspace]
resolver = "2"
members = [
    "crates/kibitz-core",
    "crates/kibitz-profile",
    "crates/kibitz-srs",
    "crates/kibitz-verbalize",
    "crates/kibitz-tb",
    "crates/si4-read",
    "app/kibitz-db",
    "bench/movegen-bench",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
repository = "https://github.com/avienu/kibitz"
rust-version = "1.82"

[workspace.dependencies]
cozy-chess = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
cc = "1"
tempfile = "3"
criterion = "0.5"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
insta = { version = "1", features = ["json", "redactions"] }

[profile.bench]
lto = "thin"

[profile.release]
lto = "thin"
