[package]
name = "kibitz-app"
version = "0.1.0"
description = "Kibitz Phase 0 spike demo — Tauri shell (board + PGN stepping + UCI engine panel)"
authors = ["Shawn O'Connor"]
license = "GPL-3.0-only"
edition = "2021"

# Standalone package: NOT a member of the repo's root cargo workspace.
# The empty [workspace] table makes cargo treat this directory as its own
# workspace root with its own Cargo.lock (crates/* stay GPL-free).
[workspace]

[lib]
name = "kibitz_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Official first-party updater plugin (Apache-2.0 OR MIT). Endpoint + pubkey
# live in tauri.conf.json > plugins > updater; until a real pubkey is set the
# update_check command reports "not configured" and never touches the network.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "sync",
    "time",
    "macros",
    "rt-multi-thread",
] }
# GPL app-layer database core (pulls the BSD workspace crates in as path deps).
kibitz-db = { path = "../kibitz-db" }
# BSD workspace crates (app -> crates dependency direction, CLAUDE.md #2).
kibitz-core = { path = "../../crates/kibitz-core" }
kibitz-profile = { path = "../../crates/kibitz-profile" }
kibitz-srs = { path = "../../crates/kibitz-srs" }
kibitz-tb = { path = "../../crates/kibitz-tb" }
kibitz-verbalize = { path = "../../crates/kibitz-verbalize" }
# Keep these versions in lockstep with the root workspace so the types unify.
rusqlite = { version = "0.32", features = ["bundled"] }
cozy-chess = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
