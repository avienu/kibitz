[package]
name = "silman-db"
description = "GPL app-layer database core: SQLite schema, importers, position index, CLI"
license = "GPL-3.0-only"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
silman-core = { path = "../../crates/silman-core" }
silman-profile = { path = "../../crates/silman-profile" }
silman-srs = { path = "../../crates/silman-srs" }
silman-verbalize = { path = "../../crates/silman-verbalize", features = ["llm"] }
cozy-chess = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

si4-read = { path = "../../crates/si4-read" }
ureq = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "silman-cli"
path = "src/bin/silman-cli.rs"

[[bin]]
name = "wsui-validate"
path = "src/bin/wsui-validate.rs"
