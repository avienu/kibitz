# Release pipeline (docs/RELEASING.md).
#
# Triggers:
#   - tag push v*        → build bundles, then create a DRAFT GitHub release
#   - workflow_dispatch  → dry-run: build + upload workflow artifacts only
#
# Signing is gated on secrets and skipped cleanly when they are absent
# (pre-enrollment state — see docs/RELEASE_CHECKLIST.md for the exact list):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD  → updater artifacts + latest.json
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#                                                                   → macOS codesign (Developer ID Application)
# Notarization takes EITHER credential, API key preferred (revocable, no
# account password in CI); the key route wins when both are present:
#   APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_P8   → App Store Connect API key
#   APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID         → Apple ID + app-specific password
#
# Signing without notarization is worse than neither: Gatekeeper reports a
# signed-but-unnotarized app more harshly than an unsigned one, so the
# build refuses that combination rather than shipping it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The build matrix is GENERATED from .github/release-targets.json, which
  # is also what the release is verified against. One declaration drives
  # both, so a target cannot be built without being required, or required
  # without being built.
  plan:
    name: Declared targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      winsign: ${{ steps.winsign.outputs.winsign }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          matrix=$(jq -c '{include: .targets}' .github/release-targets.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.targets[] | "  \(.label)  ->  \(.requires | join(", "))"' \
            .github/release-targets.json >> "$GITHUB_STEP_SUMMARY"
      # Whether Windows signing is configured has to be decided ONCE, here,
      # and carried downstream. The `secrets` context is not available in a
      # job-level `if:`, and more importantly the publish guard must know
      # whether an unsigned binary is an expected state or a broken one.
      - id: winsign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${AZURE_CLIENT_ID:-}" ]; then
            echo "winsign=true" >> "$GITHUB_OUTPUT"
          else
            echo "winsign=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Windows code signing: NOT CONFIGURED"
              echo
              echo "AZURE_CLIENT_ID is absent, so the signing job will not run and the"
              echo "Windows .msi and setup .exe will ship **unsigned**. Every friend who"
              echo "downloads them sees a SmartScreen warning. This is a green run: that"
              echo "is exactly why it is written here rather than left to inference."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Every step here is bash; on the Windows runner that is git-bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Detect available signing secrets
        id: gate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "**Updater signing skipped** — TAURI_SIGNING_PRIVATE_KEY secret absent; bundles carry no updater artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ]; then
              echo "applesign=true" >> "$GITHUB_OUTPUT"
            else
              echo "applesign=false" >> "$GITHUB_OUTPUT"
              echo "**macOS codesign/notarization skipped** — APPLE_* secrets absent; the .app/.dmg are UNSIGNED (Gatekeeper will warn)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # The App Store Connect key is a FILE credential: write the .p8 the
      # secret carries to the runner and point the bundler at it. Written
      # under RUNNER_TEMP, which the runner wipes when the job ends.
      - name: Prepare Apple notarization credentials (macOS)
        if: runner.os == 'macOS' && steps.gate.outputs.applesign == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            # Never echo the path's contents; the filename is not secret.
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
            echo "Notarization: App Store Connect API key." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_APP_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization: Apple ID + app-specific password." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::APPLE_CERTIFICATE is set but no notarization credential is. A signed, \
          un-notarized app is treated WORSE by Gatekeeper than an unsigned one. Add either \
          APPLE_API_ISSUER + APPLE_API_KEY + APPLE_API_KEY_P8, or APPLE_ID + APPLE_APP_PASSWORD \
          + APPLE_TEAM_ID."
            exit 1
          fi

      # One build step: the two signatures are independent. The updater key
      # decides whether updater artifacts are produced; the Apple secrets
      # decide whether the macOS bundle is signed and notarized. Gating one
      # on the other would silently ship unsigned macOS builds to anyone
      # who has certificates but no updater key.
      - name: Build bundles
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization credentials come from the prepare step via
          # GITHUB_ENV — whichever of the two routes was configured.
          UPDATER: ${{ steps.gate.outputs.updater }}
          BUNDLES: ${{ matrix.bundles }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          rustup target add "$RUST_TARGET"
          args=(--bundles "$BUNDLES" --target "$RUST_TARGET")
          if [ "$UPDATER" = "true" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npm run tauri build -- "${args[@]}"

      # Tauri notarizes and staples the .app, then builds the .dmg AROUND
      # the stapled app and stops there — the disk image itself is signed
      # but never submitted. Gatekeeper judges what the user double-clicks,
      # and that is the .dmg: unnotarized, it is refused even online, since
      # Apple has no record of its hash. Verified on v0.1.0-test2, which
      # passed every app-level check and would still have warned every
      # friend who downloaded it.
      - name: Notarize and staple the disk image (macOS)
        if: runner.os == 'macOS' && steps.gate.outputs.applesign == 'true'
        run: |
          set -euo pipefail
          # --target puts the bundle under target/<triple>/release/…, so
          # search rather than assume the plain path.
          dmg=$(find app/src-tauri/target -path '*/release/bundle/dmg/*.dmg' | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::signing is on but no .dmg was produced"
            exit 1
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            xcrun notarytool submit "$dmg" --wait \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
          else
            xcrun notarytool submit "$dmg" --wait \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          fi
          xcrun stapler staple "$dmg"

      # Verify the artifact, not the exit code. Both checks are what a
      # friend's Mac does on a first launch with no network: the ticket
      # must be IN the file, and Gatekeeper must accept it from there.
      - name: Verify the signed disk image (macOS)
        if: runner.os == 'macOS' && steps.gate.outputs.applesign == 'true'
        run: |
          set -euo pipefail
          dmg=$(find app/src-tauri/target -path '*/release/bundle/dmg/*.dmg' | head -1)
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/kibitz-verify
          app=$(find /tmp/kibitz-verify -maxdepth 1 -name '*.app' | head -1)
          codesign -dv --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t install "$app"
          hdiutil detach /tmp/kibitz-verify

      # Tauri names the macOS updater bundle `Kibitz.app.tar.gz` with no
      # architecture in it, so BOTH macOS legs upload the same filename and
      # download-artifact --merge-multiple silently keeps one. v0.1.0 shipped
      # with the generator logging "cannot detect arch in Kibitz.app.tar.gz"
      # and macOS auto-update simply absent. Stamp the arch on before it
      # leaves the runner; the .sig has to travel with it.
      - name: Name the macOS updater bundle for its architecture
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          arch="${{ matrix.rust_target }}"
          arch="${arch%%-*}"
          while IFS= read -r f; do
            case "$f" in
              *.sig) mv "$f" "${f%Kibitz.app.tar.gz.sig}Kibitz_${arch}.app.tar.gz.sig" ;;
              *)     mv "$f" "${f%Kibitz.app.tar.gz}Kibitz_${arch}.app.tar.gz" ;;
            esac
          done < <(find app/src-tauri/target -type f \
                     \( -name 'Kibitz.app.tar.gz' -o -name 'Kibitz.app.tar.gz.sig' \))
          find app/src-tauri/target -name 'Kibitz_*.app.tar.gz*' -exec basename {} \;

      - name: Collect bundles
        run: |
          mkdir -p dist-bundles
          BUNDLE_DIR=app/src-tauri/target
          # macOS: .dmg always; .app.tar.gz(.sig) exist only on signed builds.
          # Linux: .AppImage(+.sig) and .deb.  Windows: .msi and the NSIS
          # setup .exe, plus their updater signatures.
          find "$BUNDLE_DIR" -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*_*.app.tar.gz' -o -name '*_*.app.tar.gz.sig' \
               -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' \
               -o -name '*.msi' -o -name '*.msi.sig' \
               -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) \
            -exec cp {} dist-bundles/ \;
          ls -la dist-bundles

      - uses: actions/upload-artifact@v4
        with:
          name: kibitz-${{ matrix.name }}
          path: dist-bundles/*
          if-no-files-found: error

  # Windows signing runs as its own job for one reason: the federated
  # credential's subject ends in `:environment:release`, and that claim
  # only appears in the OIDC token when the JOB declares the environment.
  # Putting it on `bundle` would gate every platform behind an approval;
  # putting it here gates exactly the step that needs it.
  #
  # The subject is the IMMUTABLE form, with numeric owner and repo IDs:
  #     repo:avienu@4993427/kibitz@1312433848:environment:release
  # not the name-based `repo:avienu/kibitz:...` that most documentation
  # still shows. GitHub made immutable subjects the default for repos
  # created after 2026-07-15, precisely so that renaming an org or repo
  # cannot silently hand your credential to someone else. v0.1.0-test6
  # failed on exactly this with AADSTS700213, which reports the mismatch
  # accurately and does not mention that a format changed under you.
  # If this ever fails again, read the `subject claim` line the azure/login
  # step prints and make the credential match it verbatim.
  #
  # A tag subject was the alternative and does not work: wildcards are not
  # allowed in the plain subject field, so `refs/tags/v0.1.0` would not
  # authenticate v0.1.1 and every release would need a new credential.
  sign-windows:
    name: Sign Windows bundles
    needs: [plan, bundle]
    if: needs.plan.outputs.winsign == 'true'
    runs-on: windows-latest
    environment: release
    # Job-level permissions REPLACE the workflow defaults, so `contents`
    # is restated. Without `id-token: write` no OIDC token is minted at
    # all, and azure/login fails in a way that reads like a bad credential
    # rather than a missing permission — check this first if login fails.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kibitz-windows-x86_64
          path: dist-bundles

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Artifact Signing mints a short-lived certificate per signing. There
      # is deliberately nothing here that caches or pins one: a thumbprint
      # check against a cert that is meant to rotate is a bug that fails
      # the day it rotates, not a safeguard.
      - name: Sign the .msi and the setup .exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: TemeculaChessCodeSigning
          certificate-profile-name: kibitz-signing
          files-folder: dist-bundles
          files-folder-filter: msi,exe
          files-folder-recurse: false

      # Verify the ARTIFACT, not the exit code of the step above — the same
      # rule the macOS path already follows. A signing step that silently
      # no-ops produces an unsigned binary that ships, and the first symptom
      # is a friend's SmartScreen warning rather than a red build.
      - name: Verify the signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path dist-bundles\* -Include *.msi, *.exe
          # Two artifacts are signed separately, so finding neither — or
          # only one, after a rename — must fail rather than pass quietly.
          if ($files.Count -lt 2) {
            Write-Host "::error::expected a .msi and a setup .exe to verify, found $($files.Count). A bundle rename would look exactly like this."
            exit 1
          }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::VERIFICATION FAILED for $($f.Name): status '$($sig.Status)'. Signing reported success and produced a binary Windows will not trust. This is not an auth problem — the credential worked."
              $bad++
            } else {
              Write-Host "  ok  $($f.Name)"
              Write-Host "      signed by $($sig.SignerCertificate.Subject)"
            }
          }
          if ($bad -gt 0) { exit 1 }
          "### Windows code signing: OK" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "$($files.Count) artifacts signed and verified valid." >> $env:GITHUB_STEP_SUMMARY

      # Overwrite the unsigned upload in place, so nothing downstream has to
      # know which of two artifact names is the real one.
      - uses: actions/upload-artifact@v4
        with:
          name: kibitz-windows-x86_64
          path: dist-bundles/*
          overwrite: true
          if-no-files-found: error

  release:
    name: Draft GitHub release
    # `needs` includes a job that is SKIPPED when signing is unconfigured,
    # which would otherwise skip this one too. So the condition is spelled
    # out rather than reached for with always(): bundle must have SUCCEEDED
    # — a failed build must never publish — while sign-windows may either
    # have succeeded or been skipped. A FAILED signing job stops the
    # release, which is the whole point.
    if: >-
      ${{ !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.bundle.result == 'success'
      && (needs['sign-windows'].result == 'success'
          || needs['sign-windows'].result == 'skipped') }}
    needs: [plan, bundle, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Twice in one day the artifact a user would receive was not the
      # artifact anything had verified: a DMG that was signed but never
      # notarized, and releases that silently contained no Windows build
      # at all while the tester workflow produced one. Both passed every
      # green check that existed. So the release asserts what it is FOR —
      # one installer per platform we claim to support — and refuses to
      # publish a release that quietly drops one.
      - name: Every declared target is present
        run: |
          set -euo pipefail
          missing=0
          while IFS=$'\t' read -r label pattern; do
            found=$(find dist -type f -name "$pattern" | head -1)
            if [ -z "$found" ]; then
              echo "::error::$label: nothing matching '$pattern'. It is in \
          .github/release-targets.json, so this release claims to support it and does \
          not build it. Fix the target or drop the claim — do not publish the gap."
              missing=1
            else
              echo "  ok  $label -> $(basename "$found")"
            fi
          done < <(jq -r '.targets[] | . as $t | $t.requires[] | [$t.label, .] | @tsv' \
                     .github/release-targets.json)
          [ "$missing" -eq 0 ]

      # Presence is not integrity. The guard above checks that a file
      # matching the pattern exists, which is a check that READS as
      # coverage while saying nothing about whether Windows will trust it —
      # the same family of mistake as a matrix that required no Windows
      # target at all. So the signature is asserted here, from the JSON
      # rather than a hardcoded list, and it cannot be reopened by adding a
      # target or reordering jobs.
      - name: Windows bundles carry a signature
        id: winverify
        env:
          EXPECTED: ${{ needs.plan.outputs.winsign }}
        run: |
          set -euo pipefail
          patterns=$(jq -r '.targets[] | select(.os | startswith("windows"))
                              | .requires[]' .github/release-targets.json)
          if [ -z "$patterns" ]; then
            echo "  no Windows target declared; nothing to verify"
            echo "signed=n/a" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=""
          for pattern in $patterns; do
            files="$files $(find dist -type f -name "$pattern")"
          done
          # shellcheck disable=SC2086
          python3 scripts/release/has_authenticode.py $files | tee /tmp/winverify.txt
          unsigned=$(grep -c '^UNSIGNED' /tmp/winverify.txt || true)
          checked=$(grep -c -E '^(SIGNED|UNSIGNED)' /tmp/winverify.txt || true)

          if [ "$checked" -eq 0 ]; then
            echo "::error::a Windows target is declared but no artifact matched it here. \
          The presence guard should have caught this first; that it did not means the two \
          guards disagree, which is worse than either failing."
            exit 1
          fi
          if [ "$unsigned" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=false" >> "$GITHUB_OUTPUT"
          if [ "$EXPECTED" = "true" ]; then
            echo "::error::Windows signing IS configured and $unsigned artifact(s) carry no \
          signature. Either the signing job did not run for this release, or it ran and did \
          not sign what got published. Do not publish this."
            exit 1
          fi
          echo "::warning::Windows artifacts are UNSIGNED (signing is not configured). \
          Allowed, and the release notes will say so in as many words."

      - name: Detect updater key
        id: gate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate latest.json updater feed
        if: steps.gate.outputs.updater == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release/generate_latest_json.mjs \
            --version "$VERSION" --dir dist --out dist/latest.json \
            --notes "Kibitz $VERSION — see CHANGELOG.md"
      # The notes are a DOWNLOAD PAGE, not a description of one. v0.1.0
      # shipped with a platform table whose filenames were inline code —
      # it rendered as text, the maintainer tried to click it, and the
      # real files were in the collapsed Assets section further down that
      # a reader scanning top-down never reaches. Same shape as the
      # signing guard checking filenames instead of signatures: a thing
      # that reads as coverage and is not.
      #
      # So the links are built from the files actually collected, and the
      # step fails if a platform we declare support for has nothing to
      # link to. A plausible-looking dead link is worse than no link.
      # v0.1.0 published a feed covering linux-x86_64 alone. Both macOS
      # legs and Windows were simply missing, and all three existing guards
      # passed — they assert that installers are present, and that Windows
      # installers are signed. Nobody was asserting that the thing which
      # delivers the NEXT version knows these platforms exist.
      - name: The updater feed covers every declared platform
        if: steps.gate.outputs.updater == 'true'
        run: |
          set -euo pipefail
          have=$(jq -r '.platforms | keys[]' dist/latest.json | sort)
          want=$(jq -r '.targets[].updater' .github/release-targets.json | sort -u)
          echo "  declared: $(echo "$want" | tr '\n' ' ')"
          echo "  in feed:  $(echo "$have" | tr '\n' ' ')"
          missing=$(comm -23 <(echo "$want") <(echo "$have"))
          if [ -n "$missing" ]; then
            echo "::error::latest.json is missing $(echo "$missing" | tr '\n' ' ')- these \
          platforms get an installer from this release and would never be offered the next \
          one. Every other guard passes on this, which is how v0.1.0 shipped it."
            exit 1
          fi

      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "Kibitz $VERSION."
            echo
            echo "## Download"
            echo
            echo "Click the one for your machine:"
            echo
          } > notes.md

          link() { # label, glob
            f=$(find dist -maxdepth 1 -type f -name "$2" | head -1)
            if [ -z "$f" ]; then
              echo "::error::no artifact matching '$2' to link for \"$1\". The \
          release notes are the download page; a platform with nothing to link to \
          must not render as an empty row."
              return 1
            fi
            n=$(basename "$f")
            echo "- **$1** — [$n]($base/$n)" >> notes.md
          }
          link "macOS — Apple Silicon"   '*aarch64.dmg'
          link "macOS — Intel"           '*x64.dmg'
          link "Windows — installer"     '*-setup.exe'
          link "Windows — MSI"           '*.msi'
          link "Linux — AppImage"        '*.AppImage'
          link "Linux — Debian/Ubuntu"   '*.deb'

          {
            echo
            echo "---"
            echo
            if [ "${{ steps.winverify.outputs.signed }}" = "false" ]; then
              echo "> **The Windows installers here are UNSIGNED.** SmartScreen will"
              echo "> warn and name no publisher. Built without Artifact Signing"
              echo "> configured — see docs/RELEASING.md."
            elif [ "${{ steps.winverify.outputs.signed }}" = "true" ]; then
              echo "**Windows: expect one SmartScreen prompt.** The installers are signed"
              echo "and the signature is verified before publishing, but SmartScreen earns"
              echo "its reputation from download volume and a new publisher starts at zero."
              echo "Click **More info**, check it names the publisher rather than *Unknown"
              echo "publisher*, then **Run anyway**. It fades as installs accumulate."
            fi
            echo
            if [ "${{ steps.gate.outputs.updater }}" = "true" ]; then
              echo "Auto-update feed included (latest.json)."
            else
              echo "> No auto-update feed for this build (updater key absent)."
            fi
            echo
            echo "---"
            echo
            echo "_Draft — replace this section with the matching CHANGELOG.md entry before publishing (docs/RELEASE_CHECKLIST.md)._"
          } >> notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "Kibitz ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"

  # Fresh-clone build-from-source check: the README's literal commands, on a
  # bare runner. Keeps the README honest without slowing the main CI.
  from-source:
    name: from-source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: rustup default stable
        run: rustup default stable
      - name: npm ci (app/)
        working-directory: app
        run: npm ci
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: npm run tauri build (app/)
        working-directory: app
        run: npm run tauri build
