name: pages

on:
  # TODO(go-public): restore the push trigger once GitHub Pages is enabled
  # for the repo (Settings -> Pages -> GitHub Actions); until then a push
  # deploy would fail red every time.
  #   push: {branches: [main], paths: ["website/**", "scripts/site_build_guide.py", "docs/USER_GUIDE.md", ".github/workflows/pages.yml"]}
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild guide.html and verify the checked-in copy matches
        run: |
          python3 scripts/site_build_guide.py
          git diff --exit-code -- website/guide.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
