[package]
name = "kibitz-verbalize"
description = "Templated natural-language rendering of kibitz-core feature records"
license = "BSD-3-Clause"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
# The optional LLM verbalizer (Phase 4) will live behind this flag; the
# default build is fully offline.
llm = []

[dependencies]
kibitz-core = { path = "../kibitz-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
